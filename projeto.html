<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="conteiner-conteudo-principal">
        <section class="sessao-conteudo-principal">
            <div class="conteiner-modificadores">
                <div class="forca">
                    <p>FOR</p>
                    <input type="text">
                </div>
                <div class="destreza">
                    <p>DES</p>
                    <input type="text">
                </div>
                <div class="constituicao">
                    <p>CON</p>
                    <input type="text">
                </div>
                <div class="inteligencia">
                    <p>INT</p>
                    <input type="text">
                </div>
                <div class="sabedoria">
                    <p>SAB</p>
                    <input type="text">
                </div>
                <div class="carisma">
                    <p>CAR</p>
                    <input type="text">
                </div>
            </div>
            <div class="conteiner-vdv-img">
                <div class="conteiner-vdv">
                    <div>
                        <p>Vida</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Defesa</p>
                        <input type="text">
                    </div>
                    <div>
                        <p>Velocidade</p>
                        <input type="text">
                    </div>
                </div>
                <div class="conteiner-img">
                    <img src="imagem/images (3).jpg" alt="">
                </div>
            </div>
            <div class="conteiner-biografia">
                <h2>
                    Biografia
                </h2>
                <textarea cols="30" rows="25"></textarea>
            </div>
        </section>
        <section class="sessao-conteudo-secundario">
            <div class="conteiner-equipamento">
                <h2>Equipamentos</h2>
                <textarea cols="30" rows="10"></textarea>
            </div>
            <div class="conteiner-caracteristicas">
                <h2>Características</h2>
                <textarea cols="30" rows="10"></textarea>
            </div>
        </section>
    </main>
    <footer>
        <div class="conteiner-rodape">
            🚀 <a href="">Ctrl + Play</a>
        </div>
    </footer>
</body>
</html>
